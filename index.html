<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#f6e7d2" />
    <meta name="description" content="在玻璃櫥窗裡養布丁、泡澡、突變，打造全自動甜點生產線。" />
    <!-- 「加入主畫面」：start_url/scope 都寫相對路徑，GitHub Pages 的 /little-pudding-game/ 前綴才不會錯 -->
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- iOS 不讀 manifest 的 icons，只認 apple-touch-icon -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <title>小布丁農場</title>
    <!-- 粉圓體（OFL）：繁中圓體，介面的動森手感主要靠它；離線或 CDN 不通時退回系統字，功能不受影響 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f6e7d2; touch-action: none; -webkit-user-select: none; user-select: none; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      /* 除錯面板要避開 HUD：上面是資源列與布丁狀態，下面是動作列與提示 */
      #debug { position: fixed; left: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + var(--dock-h, 140px) + 110px); padding: 6px 8px; border-radius: 8px; font: 12px/1.4 ui-monospace, monospace; color: #3b2a1a; background: rgba(255,255,255,.82); pointer-events: none; white-space: pre; z-index: 2; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="debug" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
