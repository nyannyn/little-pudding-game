<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <!-- 自動販售口：外帶窗＝配色面板＋金屬雨遮＋小窗（對應 equipmentMesh.ts 的 seller） -->
  <defs>
    <linearGradient id="metalH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f6"/>
      <stop offset="1" stop-color="#b3bec9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4a898"/>
      <stop offset="1" stop-color="#d9705f"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8e6f2"/>
    </linearGradient>
  </defs>
  <ellipse cx="80" cy="146" rx="50" ry="8" fill="#5a3d28" opacity=".14"/>
  <!-- 面板 -->
  <rect x="30" y="52" width="100" height="84" rx="12" fill="url(#accent)"/>
  <rect x="34" y="56" width="92" height="8" rx="4" fill="#ffffff" opacity=".35"/>
  <!-- 雨遮 -->
  <path d="M22 50 L138 50 L128 32 L32 32 Z" fill="url(#metalH)"/>
  <rect x="22" y="48" width="116" height="8" rx="4" fill="#a9b4c0"/>
  <!-- 小窗 -->
  <rect x="48" y="70" width="64" height="40" rx="8" fill="url(#win)"/>
  <rect x="48" y="86" width="64" height="4" fill="#b3bec9"/>
  <rect x="78" y="70" width="4" height="40" fill="#b3bec9"/>
  <!-- 窗台上的甜點與錢幣 -->
  <rect x="44" y="108" width="72" height="8" rx="4" fill="#cfd6dd"/>
  <path d="M56 106 h18 l-2 8 h-14 Z" fill="#f4a7b0"/>
  <path d="M59 106 c0-5 2-7 6-7 s6 2 6 7" fill="#ffd27a"/>
  <circle cx="98" cy="104" r="8" fill="#f7c95a" stroke="#d9a02f" stroke-width="2"/>
  <path d="M98 100 v8 M96 102 h3 a1.6 1.6 0 0 1 0 3.2 h-3" fill="none" stroke="#a86d12" stroke-width="1.8" stroke-linecap="round"/>
</svg>
