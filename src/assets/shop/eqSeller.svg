<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <!-- 自動販售口：迷你自動販賣機（對應 equipmentMesh.ts 的 vendingMachine）——
       珊瑚色機身、金屬頂蓋、招牌與布丁吉祥物、條紋雨遮、展示窗兩層迷你布丁、右側操作面板、取物口 -->
  <defs>
    <linearGradient id="metalH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f6"/>
      <stop offset="1" stop-color="#b3bec9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4a898"/>
      <stop offset="1" stop-color="#d9705f"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8e6f2"/>
    </linearGradient>
  </defs>
  <ellipse cx="80" cy="150" rx="52" ry="7" fill="#5a3d28" opacity=".14"/>
  <!-- 機器本體放大 1.2 倍，才跟旁邊四張設備卡一樣占滿卡面 -->
  <g transform="translate(80 82) scale(1.2) translate(-80 -83)">
  <!-- 底座 -->
  <rect x="42" y="138" width="76" height="9" rx="3" fill="#4d4653"/>
  <!-- 機身 -->
  <rect x="45" y="40" width="70" height="100" rx="6" fill="url(#accent)"/>
  <!-- 頂蓋 -->
  <rect x="42" y="36" width="76" height="8" rx="3" fill="url(#metalH)"/>
  <!-- 招牌＋布丁吉祥物 -->
  <rect x="50" y="16" width="44" height="18" rx="5" fill="#e58a7b"/>
  <rect x="55" y="20" width="34" height="10" rx="3" fill="#fff6ea"/>
  <path d="M98 34 c0-9 3-13 9-13 s9 4 9 13 Z" fill="#f7c948"/>
  <path d="M98 26 c1-4 4-6 9-6 s8 2 9 6 c-2 2-5 3-9 3 s-7-1-9-3 Z" fill="#c2703a"/>
  <!-- 展示窗（白框＋淡藍玻璃＋反光） -->
  <rect x="50" y="54" width="42" height="52" rx="4" fill="#fff6ea"/>
  <rect x="53" y="57" width="36" height="46" rx="3" fill="url(#win)"/>
  <path d="M58 60 l-2 12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity=".9"/>
  <!-- 兩層架子與迷你布丁：上層草莓／抹茶／鮮奶酪，下層焦糖 -->
  <rect x="54" y="78" width="34" height="2.5" fill="#b3bec9"/>
  <rect x="54" y="100" width="34" height="2.5" fill="#b3bec9"/>
  <g>
    <rect x="56" y="70" width="8" height="8" rx="2" fill="#f4a7b0"/><rect x="55.5" y="68" width="9" height="3" rx="1.5" fill="#e0526b"/>
    <rect x="67" y="70" width="8" height="8" rx="2" fill="#b9d68f"/><rect x="66.5" y="68" width="9" height="3" rx="1.5" fill="#6f9a55"/>
    <rect x="78" y="70" width="8" height="8" rx="2" fill="#fff6ea"/><rect x="77.5" y="68" width="9" height="3" rx="1.5" fill="#f7c948"/>
    <rect x="56" y="92" width="8" height="8" rx="2" fill="#f7c948"/><rect x="55.5" y="90" width="9" height="3" rx="1.5" fill="#c2703a"/>
    <rect x="67" y="92" width="8" height="8" rx="2" fill="#f7c948"/><rect x="66.5" y="90" width="9" height="3" rx="1.5" fill="#c2703a"/>
    <rect x="78" y="92" width="8" height="8" rx="2" fill="#f7c948"/><rect x="77.5" y="90" width="9" height="3" rx="1.5" fill="#c2703a"/>
  </g>
  <!-- 條紋雨遮 -->
  <path d="M47 54 L95 54 L92 46 L50 46 Z" fill="#fff6ea"/>
  <path d="M50 46 L58 46 L57 54 L47 54 Z M66 46 L74 46 L74 54 L65 54 Z M82 46 L92 46 L95 54 L83 54 Z" fill="#e58a7b"/>
  <!-- 右側操作面板：投幣口、小螢幕、三顆按鈕 -->
  <rect x="97" y="54" width="14" height="50" rx="3" fill="url(#metalH)"/>
  <rect x="100" y="58" width="8" height="2.5" rx="1" fill="#4d4653"/>
  <rect x="99.5" y="64" width="9" height="7" rx="1.5" fill="#4d4653"/>
  <circle cx="104" cy="79" r="3" fill="#ffd764"/>
  <circle cx="104" cy="88" r="3" fill="#8fd0c9"/>
  <circle cx="104" cy="97" r="3" fill="#f4a7b0"/>
  <!-- 取物口＋托盤 -->
  <rect x="54" y="114" width="36" height="12" rx="3" fill="#4d4653"/>
  <rect x="52" y="126" width="40" height="4" rx="2" fill="#cfd6dd"/>
  </g>
</svg>
