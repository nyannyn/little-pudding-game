<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <!-- 補貨合約：牆邊的補貨信箱＝金屬立柱＋配色箱體＋小旗（對應 equipmentMesh.ts 的 restock） -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef2f6"/>
      <stop offset=".5" stop-color="#cfd6dd"/>
      <stop offset="1" stop-color="#a9b4c0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4a898"/>
      <stop offset="1" stop-color="#d9705f"/>
    </linearGradient>
  </defs>
  <ellipse cx="80" cy="146" rx="40" ry="8" fill="#5a3d28" opacity=".14"/>
  <!-- 立柱 -->
  <rect x="72" y="80" width="16" height="60" rx="6" fill="url(#metal)"/>
  <!-- 箱體（圓頂信箱） -->
  <path d="M40 54 Q40 30 64 30 L110 30 Q124 30 124 44 L124 84 L40 84 Z" fill="url(#accent)"/>
  <path d="M44 52 Q44 36 62 36 L100 36 L100 40 L62 40 Q50 40 48 52 Z" fill="#ffffff" opacity=".35"/>
  <!-- 投信口 -->
  <rect x="52" y="60" width="44" height="10" rx="5" fill="#a84a3c"/>
  <!-- 門把 -->
  <circle cx="112" cy="62" r="5" fill="#cfd6dd"/>
  <!-- 小旗（金屬） -->
  <rect x="122" y="30" width="6" height="40" rx="3" fill="#a9b4c0"/>
  <path d="M128 30 L150 38 L128 46 Z" fill="#cfd6dd"/>
  <!-- 信件（合約） -->
  <rect x="56" y="88" width="40" height="26" rx="4" fill="#fff8e8" stroke="#dcc3a0" stroke-width="2"/>
  <path d="M56 90 L76 104 L96 90" fill="none" stroke="#dcc3a0" stroke-width="2"/>
</svg>
