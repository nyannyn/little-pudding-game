<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <!-- 自動注液閥：從頂板垂下的管線，末端一個閥門對著澡盆（對應 equipmentMesh.ts 的 autoFill） -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef2f6"/>
      <stop offset=".5" stop-color="#cfd6dd"/>
      <stop offset="1" stop-color="#a9b4c0"/>
    </linearGradient>
    <linearGradient id="metalH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f6"/>
      <stop offset="1" stop-color="#b3bec9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4a898"/>
      <stop offset="1" stop-color="#d9705f"/>
    </linearGradient>
    <linearGradient id="caramel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6952e"/>
      <stop offset="1" stop-color="#b9691a"/>
    </linearGradient>
  </defs>
  <ellipse cx="80" cy="146" rx="46" ry="8" fill="#5a3d28" opacity=".14"/>
  <!-- 頂板橫管 -->
  <rect x="28" y="18" width="104" height="14" rx="7" fill="url(#metalH)"/>
  <!-- 直管 -->
  <rect x="72" y="26" width="16" height="60" rx="6" fill="url(#metal)"/>
  <!-- 閥門（配色） -->
  <rect x="58" y="80" width="44" height="30" rx="8" fill="url(#accent)"/>
  <rect x="62" y="84" width="36" height="8" rx="4" fill="#ffffff" opacity=".35"/>
  <circle cx="106" cy="95" r="9" fill="url(#metalH)"/>
  <rect x="103" y="86" width="6" height="18" rx="3" fill="#8a97a6"/>
  <!-- 流出的焦糖 -->
  <path d="M76 110 Q80 118 84 110 L84 124 Q80 132 76 124 Z" fill="url(#caramel)"/>
  <ellipse cx="80" cy="132" rx="14" ry="5" fill="#e6952e"/>
  <ellipse cx="80" cy="131" rx="9" ry="2.6" fill="#ffd27a" opacity=".7"/>
</svg>
